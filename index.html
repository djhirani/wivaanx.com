<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WivaanX Technologies — First rays of intelligence.</title>
<meta name="description" content="WivaanX Technologies builds practical AI models for real businesses. First rays of intelligence.">
<meta property="og:title" content="WivaanX Technologies">
<meta property="og:description" content="First rays of intelligence. We build practical AI models for real businesses.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wivaanx.com/">
<meta name="theme-color" content="#FAFAFA">
<meta property="og:image" content="https://wivaanx.com/wivaanx-lockup.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ——— WivaanX P0 holding page · blueprint v2.1 "Engineering White" ——— */
  :root{
    --paper:#FAFAFA;
    --surface:#FFFFFF;
    --ink:#161616;
    --muted:#6B6B6B;
    --grid:#ECECEC;
    --keyline:#DDDDDD;
    --accent:#E8590C;
    --accent-hover:#D9480F;
    --gold:#B7791F;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100svh;
    display:flex;flex-direction:column;
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);
    font-synthesis-weight:none;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent);color:#FFF}

  /* ——— The Drafting Grid: fixed, out of flow (zero CLS) ——— */
  .grid-bg{
    position:fixed;inset:0;z-index:-2;
    background-image:
      linear-gradient(var(--keyline) 1px, transparent 1px),
      linear-gradient(90deg, var(--keyline) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:160px 160px, 160px 160px, 32px 32px, 32px 32px;
  }
  .grid-bg::after{ /* soft vignette keeps the centre calm, edges technical */
    content:"";position:absolute;inset:0;
    background:radial-gradient(90% 70% at 50% 42%, rgba(250,250,250,.92) 0%, rgba(250,250,250,.45) 55%, rgba(250,250,250,0) 100%);
  }

  /* Drifting wireframe boxes — the living technical drawing */
  .boxes{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .boxes i{
    position:absolute;display:block;
    border:1px solid var(--keyline);
    background:rgba(255,255,255,.35);
    will-change:transform;
  }
  .boxes .b1{width:22vmin;height:14vmin;left:8%;top:16%;animation:drift1 64s ease-in-out infinite alternate}
  .boxes .b2{width:12vmin;height:12vmin;right:12%;top:12%;border-style:dashed;background:none;animation:drift2 48s ease-in-out infinite alternate}
  .boxes .b3{width:28vmin;height:9vmin;right:6%;bottom:22%;animation:drift3 76s ease-in-out infinite alternate}
  .boxes .b4{width:9vmin;height:16vmin;left:14%;bottom:14%;animation:drift4 56s ease-in-out infinite alternate}
  @keyframes drift1{from{transform:translate3d(-3vmin,2vmin,0)}to{transform:translate3d(5vmin,-3vmin,0)}}
  @keyframes drift2{from{transform:translate3d(2vmin,-2vmin,0) rotate(0deg)}to{transform:translate3d(-4vmin,3vmin,0) rotate(3deg)}}
  @keyframes drift3{from{transform:translate3d(4vmin,1vmin,0)}to{transform:translate3d(-5vmin,-2vmin,0)}}
  @keyframes drift4{from{transform:translate3d(-2vmin,-3vmin,0)}to{transform:translate3d(3vmin,4vmin,0)}}
  .paused .boxes i{animation-play-state:paused}

  /* ——— Announcement bar ——— */
  .bar{
    display:flex;align-items:center;justify-content:center;gap:.55em;
    padding:.55rem 1rem;
    background:var(--surface);
    border-bottom:1px solid var(--grid);
    font-family:var(--mono);font-size:.78rem;letter-spacing:.02em;
    color:var(--muted);
  }
  .bar b{color:var(--ink);font-weight:500}
  .dot{position:relative;width:.5em;height:.5em;flex:none;border-radius:50%;background:var(--accent)}
  .dot::after{
    content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);
    animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite;
  }
  @keyframes pulse{
    0%{transform:scale(1);opacity:.9}
    70%,100%{transform:scale(2.6);opacity:0}
  }

  /* ——— Centre stage ——— */
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:3rem 1.25rem;
  }
  .mark{width:clamp(120px,16vw,176px);height:auto;display:block;overflow:visible}
  .mark .arc{animation:rise .8s ease-out both .15s}
  @keyframes rise{from{transform:translateY(30px)}to{transform:translateY(0)}}
  .lockup{width:clamp(300px,56vw,500px);height:auto;display:block}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* Self-drawing dashed chalk line, swept under the stage on load */
  .chalk{
    width:min(560px,80vw);height:24px;display:block;margin-top:.4rem;
    overflow:visible;
  }
  .chalk path{
    stroke:#C9C9C9;stroke-width:1.5;fill:none;
    stroke-dasharray:.028 .018;   /* dash pattern (pathLength-normalised) */
  }
  .chalk .sweep{stroke-dashoffset:0;animation:draw 1.2s ease-out both .5s}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

  .tagline{
    margin-top:1.2rem;
    font-size:clamp(1.05rem,2.4vw,1.4rem);
    color:var(--muted);letter-spacing:.01em;
  }

  /* Thin animated sunrise-gradient horizon-line under the tagline */
  .horizon{
    width:min(320px,60vw);height:2px;margin-top:1.1rem;
    border-radius:1px;overflow:hidden;position:relative;
  }
  .horizon i{
    position:absolute;top:0;left:0;height:100%;width:300%;
    background:linear-gradient(90deg,
      #B7791F 0%, #E8590C 25%, #F5B942 50%, #E8590C 75%, #B7791F 100%);
    will-change:transform;
    animation:horizon-drift 8s linear infinite;
  }
  @keyframes horizon-drift{from{transform:translateX(0)}to{transform:translateX(-66.666%)}}
  .paused .horizon i{animation-play-state:paused}

  .sub{
    margin-top:1.3rem;max-width:34em;
    font-size:clamp(.95rem,2vw,1.05rem);line-height:1.6;color:var(--muted);
  }
  .cta{
    display:inline-block;margin-top:2.2rem;
    padding:.72em 1.6em;border-radius:99px;
    background:var(--accent);color:#FFF;
    font-weight:700;font-size:1.17rem;text-decoration:none;letter-spacing:-.01em;
    transition:transform .18s ease,background-color .18s ease,box-shadow .18s ease;
  }
  .cta:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 3px 16px rgba(232,89,12,.22)}
  .cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* One-time fade-rise of the stage — transform/opacity only */
  .reveal{animation:reveal .7s ease-out both}
  .r2{animation-delay:.2s}.r3{animation-delay:.32s}.r4{animation-delay:.44s}.r5{animation-delay:.56s}.r6{animation-delay:.68s}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  footer{
    padding:1.4rem 1rem;text-align:center;
    font-size:.8rem;color:#9A9A9A;letter-spacing:.02em;
  }

  /* ——— Reduced motion: grid static, boxes still, arc final, chalk drawn ——— */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    .mark .arc{transform:none}
    .chalk .sweep{stroke-dashoffset:0}
  }
  @media (min-width:2200px){ .sub{max-width:38em} }
</style>
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>
<div class="boxes" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

<header class="bar" role="banner">
  <span class="dot" aria-hidden="true"></span>
  <span><b>WivaanX-4B-v1</b> — in training</span>
</header>

<main>
  <svg class="mark reveal" viewBox="0 0 176 96" role="img" aria-label="WivaanX mark: a sun rising over a horizon line" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="above"><rect x="0" y="0" width="176" height="66"/></clipPath>
    </defs>
    <g clip-path="url(#above)">
      <path class="arc" d="M58 66 a30 30 0 0 1 60 0" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <line x1="8" y1="66" x2="168" y2="66" stroke="#161616" stroke-width="1.5" stroke-linecap="round"/>
  </svg>

  <svg class="chalk reveal r2" viewBox="0 0 560 24" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <path class="sweep" pathLength="1" d="M2 20 C 150 4, 410 4, 558 20"/>
  </svg>

  <img class="lockup reveal r3" src="wivaanx-lockup.png" alt="WivaanX Technologies" width="1061" height="203" fetchpriority="high">
  <h1 class="sr-only">WivaanX Technologies</h1>
  <p class="tagline reveal r4">First rays of intelligence.</p>
  <div class="horizon reveal r4" aria-hidden="true"><i></i></div>
  <p class="sub reveal r5">WivaanX Technologies builds practical AI models for real businesses.</p>
  <a class="cta reveal r6" href="mailto:hello@wivaanx.com">hello@wivaanx.com</a>
</main>

<footer>© 2026 WivaanX Technologies</footer>

<script>
  // Pause the drifting boxes and horizon-line when the tab is hidden.
  document.addEventListener("visibilitychange", function () {
    document.body.classList.toggle("paused", document.hidden);
  });
</script>
</body>
</html>
